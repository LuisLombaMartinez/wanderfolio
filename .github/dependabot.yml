# Weekly dependency updates. Minor and patch updates are grouped into one PR per ecosystem;
# major updates arrive one PR each. github-actions keeps the commit-SHA pins in the workflows
# current (it updates the SHA and the '# vN' comment together).
#
# cooldown: a release must be 7 days old before a version update proposes it, so a freshly
# published (possibly compromised) package waits a week. Cooldown only affects version updates;
# security updates are never delayed by it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-frontend-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /infra
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-infra-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /backend
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gomod-backend-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions-root-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /infra/local
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-compose-infra-local-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /backend/processing
    target-branch: main
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
