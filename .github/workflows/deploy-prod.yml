name: Deploy to prod

# The manual "Deploy to prod" button (ADR-0006): Actions tab, "Deploy to prod", Run workflow, branch main.
# It deploys the commit that the latest successful staging deploy ran, NOT whatever main is now, so prod
# gets exactly what was checked on staging. A GitHub Environment with required reviewers is not used
# (a private repo needs Enterprise for that); the guard is that only a person with write access can press
# the button, and that the run must be on main.
#
# Limits, on purpose: prod always runs main's CURRENT workflow files and scripts with the staged
# commit's code, and the button only promotes the latest successful staging deploy; there is no way to
# pick an older commit. A rollback is a revert merged to main, which then goes through staging.
#
# The jobs have no `environment:`: that would change the OIDC subject the deploy role trusts (see the
# comment in deploy-stage.yml). The role's trust policy only accepts the main ref, so a run started from
# another branch could not deploy even if the check below were removed.
on:
  workflow_dispatch:

permissions:
  contents: read

# One prod deploy at a time, never two on the same stack.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  resolve:
    name: Pick the staged commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - name: Refuse any ref but main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Deploy to prod only runs from main (this run is on ${REF}). Choose the main branch in Run workflow."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the commit of the latest successful staging deploy
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          sha="$(bash infra/scripts/latest-staging-sha.sh)"
          # It must be on main: staging only deploys main, but check rather than trust a run name.
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::${sha} is not on main"; exit 1; }
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          {
            echo "### Deploying \`${sha}\` to prod"
            echo
            echo "This is the commit of the latest successful staging deploy. Main is at \`$(git rev-parse origin/main)\`."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Prod
    needs: resolve
    uses: ./.github/workflows/deploy-stage.yml
    permissions:
      contents: read
      id-token: write
    with:
      stage: prod
      sha: ${{ needs.resolve.outputs.sha }}
