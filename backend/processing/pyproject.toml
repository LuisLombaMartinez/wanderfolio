[project]
name = "viajecito-processing"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["viajecito_processing", "tests"]

[tool.coverage.run]
source = ["viajecito_processing"]
branch = true

[tool.coverage.report]
# CI runs `pytest --cov`; a plain `pytest` (or a single test) does not measure or enforce this.
# ratchet: raise when coverage goes up, never lower without a note in the PR.
# Measured 2026-11-26: 94.06% (statements and branches together; floor rounded down).
fail_under = 94
show_missing = true
